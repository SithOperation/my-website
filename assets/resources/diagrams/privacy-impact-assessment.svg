<text x="775" y="343" text-anchor="middle" fill="#f1e8d8" font-family="Arial" font-size="17" font-weight="700">and use</text>
<line x1="855" y1="325" x2="890" y2="325" stroke="#d8c3a5" stroke-width="5"/>
<polygon points="890,325 875,315 875,335" fill="#d8c3a5"/>
