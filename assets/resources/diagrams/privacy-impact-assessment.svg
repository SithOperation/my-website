<text x="580" y="315" text-anchor="middle" fill="#f1e8d8" font-family="Arial" font-size="17" font-weight="700">Data</text>
<text x="580" y="343" text-anchor="middle" fill="#f1e8d8" font-family="Arial" font-size="17" font-weight="700">categories</text>
<line x1="660" y1="325" x2="695" y2="325" stroke="#d8c3a5" stroke-width="5"/>
<polygon points="695,325 680,315 680,335" fill="#d8c3a5"/>
