<text x="970" y="343" text-anchor="middle" fill="#f1e8d8" font-family="Arial" font-size="17" font-weight="700">and flows</text>
<line x1="1050" y1="325" x2="1085" y2="325" stroke="#d8c3a5" stroke-width="5"/>
<polygon points="1085,325 1070,315 1070,335" fill="#d8c3a5"/>
