<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img">
<title>Privacy Impact Assessment</title>
<rect width="1200" height="700" fill="#151515"/>
<text x="600" y="70" text-anchor="middle" fill="#f1e8d8" font-family="Arial" font-size="40" font-weight="700">Privacy Impact Assessment</text>
<rect x="110" y="265" width="160" height="120" rx="18" fill="#292929" stroke="#8b2c2c" stroke-width="6"/>
<text x="190" y="315" text-anchor="middle" fill="#f1e8d8" font-family="Arial" font-size="17" font-weight="700">Purpose</text>
<text x="190" y="343" text-anchor="middle" fill="#f1e8d8" font-family="Arial" font-size="17" font-weight="700">and scope</text>
<line x1="270" y1="325" x2="305" y2="325" stroke="#d8c3a5" stroke-width="5"/>
<polygon points="305,325 290,315 290,335" fill="#d8c3a5"/>
