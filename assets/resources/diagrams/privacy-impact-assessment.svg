<text x="385" y="315" text-anchor="middle" fill="#f1e8d8" font-family="Arial" font-size="17" font-weight="700">People</text>
<text x="385" y="343" text-anchor="middle" fill="#f1e8d8" font-family="Arial" font-size="17" font-weight="700">affected</text>
<line x1="465" y1="325" x2="500" y2="325" stroke="#d8c3a5" stroke-width="5"/>
<polygon points="500,325 485,315 485,335" fill="#d8c3a5"/>
