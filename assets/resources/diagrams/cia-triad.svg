<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-labelledby="title desc"><title id="title">CIA Triad Asset Assessment</title><desc id="desc">Confidentiality, integrity, and availability panels connect to a protected information asset.</desc><rect width="900" height="540" fill="#090a0a"/><g fill="none" stroke="#777a77" stroke-width="3"><path d="M255 185L390 260M645 185L510 260M450 405V330"/></g><g font-family="Segoe UI,Arial,sans-serif"><g><rect x="70" y="75" width="300" height="130" fill="#171817" stroke="#a72c2c" stroke-width="3"/><text x="95" y="112" fill="#c8b98f" font-size="14" font-weight="700" letter-spacing="2">01 / CONFIDENTIALITY</text><text x="95" y="148" fill="#e4e4dc" font-size="20">Prevent unauthorized disclosure</text><text x="95" y="178" fill="#a5a69f" font-size="15">Access • handling • privacy</text></g><g><rect x="530" y="75" width="300" height="130" fill="#171817" stroke="#a72c2c" stroke-width="3"/><text x="555" y="112" fill="#c8b98f" font-size="14" font-weight="700" letter-spacing="2">02 / INTEGRITY</text><text x="555" y="148" fill="#e4e4dc" font-size="20">Prevent improper alteration</text><text x="555" y="178" fill="#a5a69f" font-size="15">Accuracy • trust • provenance</text></g><g><rect x="300" y="355" width="300" height="130" fill="#171817" stroke="#a72c2c" stroke-width="3"/><text x="325" y="392" fill="#c8b98f" font-size="14" font-weight="700" letter-spacing="2">03 / AVAILABILITY</text><text x="325" y="428" fill="#e4e4dc" font-size="20">Maintain reliable access</text><text x="325" y="458" fill="#a5a69f" font-size="15">Resilience • recovery • capacity</text></g><circle cx="450" cy="280" r="86" fill="#232422" stroke="#e4e4dc" stroke-width="3"/><text x="450" y="270" fill="#c8b98f" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="2">PROTECTED</text><text x="450" y="303" fill="#e4e4dc" text-anchor="middle" font-size="25" font-weight="700">ASSET</text></g></svg>