<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Sentinel Grid | Joseph Technologies</title>
    <link rel="icon" href="favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/favicon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="stylesheet" href="assets/vendor/maplibre/maplibre-gl.css?v=20260725-mobile-map">
    <link rel="stylesheet" href="assets/css/editorial-system.css?v=20260725-mobile-map">
    <link rel="stylesheet" href="assets/css/sentinel-map.css?v=20261111-free-news">
</head>
<body>
    <a class="skip-link" href="#sentinel-map">Skip to intelligence map</a>
    <main class="sentinel-app" aria-label="Sentinel Grid">
        <header class="sentinel-topbar" aria-label="Sentinel Grid controls">
            <a class="sentinel-back" href="index.html#sentinel-dashboard" aria-label="Back to Joseph Technologies">← Joseph Technologies</a>
            <div class="sentinel-wordmark" aria-label="Sentinel Grid">SENTINEL <span>GRID</span></div>
            <div id="ops-status" class="sentinel-status is-loading" role="status" aria-live="polite">
                <span class="status-light" aria-hidden="true"></span>
                <span id="ops-status-text">Connecting</span>
                <button id="coverage-status-toggle" class="coverage-status-toggle" type="button" aria-expanded="false" aria-controls="coverage-details" hidden>Details</button>
                <div id="coverage-details" class="coverage-details" role="dialog" aria-label="Sentinel coverage details" hidden></div>
            </div>
            <button id="event-list-toggle" class="sentinel-tool" type="button" aria-expanded="false" aria-controls="event-panel">Events <span id="event-feed-count">—</span></button>
        </header>
        <section class="sentinel-map-stage" aria-label="Global intelligence map">
            <div id="sentinel-map" role="region" aria-label="Interactive global Sentinel intelligence map"></div>
            <div id="sentinel-event-hit-overlay" aria-label="Published event plot controls"></div>
            <div id="map-loading" class="map-loading" role="status"><span></span>Building map...</div>
            <div class="sentinel-map-label"><strong>GLOBAL SIGNAL MAP</strong><span id="map-count" aria-live="polite">Preparing map...</span></div>
            <div class="sentinel-legend" aria-label="Map legend"><span><i class="city-light"></i> Major city</span><span><i class="news-light"></i> News</span><span><i class="war-light"></i> War</span><span><i class="earthquake-light"></i> Earthquake</span></div>
        </section>
        <aside id="event-panel" class="event-drawer" aria-label="Published events" aria-hidden="true">
            <div class="event-drawer-heading"><div><span class="eyebrow">PUBLISHED SIGNALS</span><h2 id="event-drawer-title">Events at this map point</h2></div><button id="event-panel-close" class="drawer-close" type="button" aria-label="Close events">×</button></div>
            <div class="news-filter-bar" aria-label="Signal filters">
                <label>Country <select id="news-filter-country"><option value="all">All</option></select></label>
                <label>Category <select id="news-filter-category"><option value="all">All</option></select></label>
                <label>Severity <select id="news-filter-severity"><option value="all">All</option></select></label>
            </div>
            <div id="news-feed" class="news-feed" aria-live="polite"></div>
            <div id="event-detail" class="event-detail" hidden><p class="empty-kicker">SELECT A RED LIGHT</p><p>Click a plotted event or city light to inspect published records.</p></div>
        </aside>
    </main>
    <script src="assets/vendor/maplibre/maplibre-gl.js?v=20260725-mobile-map"></script>
    <script src="assets/js/sentinel-data.js?v=20261111-free-news"></script>
    <script src="assets/js/sentinel-gods-eye-adapter.js?v=20260830-gods-eye-globe"></script>
    <script src="assets/js/sentinel-map.js?v=20261111-free-news"></script>
</body>
</html>
