name: Sync X Early Reports

on:
  repository_dispatch:
    types: [x-sources-published]
  workflow_dispatch:
    inputs:
      slot_id:
        description: "Producer slot ID (YYYY-MM-DD-morning/evening)"
        required: true
        type: string
      generation_id:
        description: "Producer generation ID"
        required: true
        type: string
      source_commit_sha:
        description: "Exact 40-character x-sources commit SHA"
        required: true
        type: string
      schema_version:
        description: "Feed schema version"
        required: true
        default: "1.0"
        type: string
      report_count:
        description: "Expected report count"
        required: true
        type: number
      completed_at:
        description: "Producer completion timestamp"
        required: true
        type: string
      force:
        description: "Replace a different generation for this slot"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: website-x-sources-synchronization
  cancel-in-progress: false

jobs:
  sync-x-sources:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build and validate dispatch payload
        id: payload
        shell: bash
        env:
          SLOT_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.slot_id || inputs.slot_id }}
          GENERATION_ID: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.generation_id || inputs.generation_id }}
          SOURCE_COMMIT_SHA: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.source_commit_sha || inputs.source_commit_sha }}
          SCHEMA_VERSION: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.schema_version || inputs.schema_version }}
          REPORT_COUNT: ${{ github.event_name == 'repository_dispatch' && format('{0}', github.event.client_payload.report_count) || format('{0}', inputs.report_count) }}
          COMPLETED_AT: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.completed_at || inputs.completed_at }}
          FORCE: ${{ github.event_name == 'repository_dispatch' && toJSON(github.event.client_payload.force) || toJSON(inputs.force) }}
        run: |
          jq -n \
            --arg slot_id "$SLOT_ID" \
            --arg generation_id "$GENERATION_ID" \
            --arg source_commit_sha "$SOURCE_COMMIT_SHA" \
            --arg schema_version "$SCHEMA_VERSION" \
            --argjson report_count "$REPORT_COUNT" \
            --arg completed_at "$COMPLETED_AT" \
            --argjson force "$FORCE" \
            '{
              slot_id: $slot_id,
              generation_id: $generation_id,
              source_commit_sha: $source_commit_sha,
              schema_version: $schema_version,
              report_count: $report_count,
              completed_at: $completed_at,
              force: $force
            }' > "$RUNNER_TEMP/x-dispatch-payload.json"
          python -c "import json; from pathlib import Path; from scheduling.x_source_sync import DispatchPayload; DispatchPayload.parse(json.loads(Path('$RUNNER_TEMP/x-dispatch-payload.json').read_text()))"
          echo "source_commit_sha=$SOURCE_COMMIT_SHA" >> "$GITHUB_OUTPUT"

      - name: Diagnose private repository access
        shell: bash
        env:
          REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Target repository: SithOperation/x-sources"
          echo "Target commit: ${{ steps.payload.outputs.source_commit_sha }}"
          if [[ -z "$REPO_ACCESS_TOKEN" ]]; then
            echo "REPO_ACCESS_TOKEN: missing"
            echo "::error::REPO_ACCESS_TOKEN is missing"
            exit 1
          fi
          echo "REPO_ACCESS_TOKEN: present"

      - name: Checkout immutable private X sources generation
        uses: actions/checkout@v6
        with:
          repository: SithOperation/x-sources
          ref: ${{ steps.payload.outputs.source_commit_sha }}
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: external/x-sources

      - name: Validate and publish X sources
        id: sync
        run: >-
          python3 scripts/process_x_dispatch.py prepare
          --payload "$RUNNER_TEMP/x-dispatch-payload.json"

      - name: Regenerate X report layers
        if: steps.sync.outputs.process == 'true'
        run: python3 main.py

      - name: Record completed website generation
        if: steps.sync.outputs.process == 'true'
        run: >-
          python3 scripts/process_x_dispatch.py complete
          --payload "$RUNNER_TEMP/x-dispatch-payload.json"

      - name: Commit generated website data
        if: steps.sync.outputs.process == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/x_sources.json \
            data/x_source_sync_state.json \
            data/output/x_report_events.json \
            data/output/x_report_pinpoints.geojson
          git commit -m "Publish X source generation ${{ github.run_id }}"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
