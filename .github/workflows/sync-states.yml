name: Sync Monitor States


on:

  workflow_dispatch:


  schedule:

    - cron: "*/10 * * * *"



permissions:

  contents: write



jobs:


  sync:


    runs-on: ubuntu-latest



    steps:


      - name: Checkout Website

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      - name: Checkout EWS

        uses: actions/checkout@v4

        with:

          repository: SithOperation/EWS-discord-monitor

          token: ${{ secrets.REPO_ACCESS_TOKEN }}

          path: external/ews



      - name: Checkout Disaster

        uses: actions/checkout@v4

        with:

          repository: SithOperation/earthquake-volcano-discord-monitor

          token: ${{ secrets.REPO_ACCESS_TOKEN }}

          path: external/disaster



      - name: Checkout AI Digest

        uses: actions/checkout@v4

        with:

          repository: SithOperation/ai-cyber-daily-digest

          token: ${{ secrets.REPO_ACCESS_TOKEN }}

          path: external/ai



      - name: Verify source files

        run: |


          echo "Checking EWS..."

          test -f external/ews/state.json



          echo "Checking Disaster State..."

          test -f external/disaster/data/disaster_state.json



          echo "Checking Disaster Map Files..."

          test -f external/disaster/data/earthquakes.json

          test -f external/disaster/data/volcanoes.json

          test -f external/disaster/data/weather.json

          test -f external/disaster/data/solar.json



          echo "Checking AI Digest..."

          test -f external/ai/data/ai_cyber_digest.json



          echo "All source files found"




      - name: Copy dashboard data

        run: |


          mkdir -p data



          # EWS

          cp external/ews/state.json \
          data/ews_state.json



          # Disaster dashboard feed

          cp external/disaster/data/disaster_state.json \
          data/disaster_state.json



          # MapLibre feeds

          cp external/disaster/data/earthquakes.json \
          data/earthquakes.json



          cp external/disaster/data/volcanoes.json \
          data/volcanoes.json



          cp external/disaster/data/weather.json \
          data/weather.json



          cp external/disaster/data/solar.json \
          data/solar.json



          # AI digest

          cp external/ai/data/ai_cyber_digest.json \
          data/ai_cyber_digest.json




      - name: Verify copied files

        run: |


          echo "Dashboard data:"


          ls -lh data/



          echo "Earthquakes sample:"

          head -30 data/earthquakes.json



          echo "Weather sample:"

          head -30 data/weather.json




      - name: Commit dashboard updates

        run: |


          git config user.name "github-actions"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add data/



          if git diff --cached --quiet; then

              echo "No updates"

              exit 0

          fi



          git commit -m "Update intelligence feeds"



          git push
