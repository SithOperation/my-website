name: Sync Monitor States


on:

  workflow_dispatch:


  schedule:

    - cron: "*/10 * * * *"



permissions:

  contents: write



jobs:


  sync:


    runs-on: ubuntu-latest



    steps:


      - name: Checkout Website

        uses: actions/checkout@v4

        with:

          fetch-depth: 0



      - name: Checkout EWS

        uses: actions/checkout@v4

        with:

          repository: SithOperation/EWS-discord-monitor

          token: ${{ secrets.REPO_ACCESS_TOKEN }}

          path: external/ews



      - name: Checkout Disaster

        uses: actions/checkout@v4

        with:

          repository: SithOperation/earthquake-volcano-discord-monitor

          token: ${{ secrets.REPO_ACCESS_TOKEN }}

          path: external/disaster



      - name: Checkout AI Digest

        uses: actions/checkout@v4

        with:

          repository: SithOperation/ai-cyber-daily-digest

          token: ${{ secrets.REPO_ACCESS_TOKEN }}

          path: external/ai



      - name: Checkout Sentinel Grid

        uses: actions/checkout@v4

        with:

          repository: SithOperation/sentinel-grid-intelligence

          token: ${{ secrets.REPO_ACCESS_TOKEN }}

          path: external/sentinel



      - name: Verify source files

        run: |


          echo "Checking EWS..."

          test -f external/ews/state.json



          echo "Checking Disaster State..."

          test -f external/disaster/data/disaster_state.json



          echo "Checking Disaster Map Files..."

          test -f external/disaster/data/earthquakes.json

          test -f external/disaster/data/volcanoes.json

          test -f external/disaster/data/weather.json

          test -f external/disaster/data/solar.json



          echo "Checking AI Digest..."

          test -f external/ai/data/ai_cyber_digest.json



          echo "Checking Sentinel Grid..."

          test -f external/sentinel/data/output/dashboard.json

          test -f external/sentinel/data/output/intelligence_brief.json

          test -f external/sentinel/data/output/map_events.json

          test -f external/sentinel/data/output/timeline.json

          test -f external/sentinel/data/output/trends.json

          test -f external/sentinel/data/output/world_events.json

          test -f external/sentinel/data/output/health.json

          test -f external/sentinel/data/output/manifest.json



          echo "All source files found"




      - name: Copy dashboard data

        run: |


          mkdir -p data



          # ==========================
          # EWS
          # ==========================

          cp external/ews/state.json \
          data/ews_state.json



          # ==========================
          # Disaster Intelligence
          # ==========================

          cp external/disaster/data/disaster_state.json \
          data/disaster_state.json



          cp external/disaster/data/earthquakes.json \
          data/earthquakes.json



          cp external/disaster/data/volcanoes.json \
          data/volcanoes.json



          cp external/disaster/data/weather.json \
          data/weather.json



          cp external/disaster/data/solar.json \
          data/solar.json



          # ==========================
          # AI Cyber Digest
          # ==========================

          cp external/ai/data/ai_cyber_digest.json \
          data/ai_cyber_digest.json



          # ==========================
          # Sentinel Grid Intelligence
          # ==========================

          cp external/sentinel/data/output/dashboard.json \
          data/dashboard.json



          cp external/sentinel/data/output/intelligence_brief.json \
          data/intelligence_brief.json



          cp external/sentinel/data/output/map_events.json \
          data/map_events.json



          cp external/sentinel/data/output/timeline.json \
          data/timeline.json



          cp external/sentinel/data/output/trends.json \
          data/trends.json



          cp external/sentinel/data/output/world_events.json \
          data/world_events.json



          cp external/sentinel/data/output/health.json \
          data/health.json



          # Publish the release marker last. The frontend only switches
          # publications after this complete manifest becomes available.
          cp external/sentinel/data/output/manifest.json \
          data/manifest.json




      - name: Verify copied files

        run: |


          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          data_dir = Path("data")
          manifest = json.loads((data_dir / "manifest.json").read_text(encoding="utf-8"))

          if str(manifest.get("schema_version", "")).split(".", 1)[0] != "1":
              raise SystemExit("Unsupported Sentinel manifest schema")

          if not manifest.get("publication_id"):
              raise SystemExit("Sentinel manifest is missing publication_id")

          for filename, metadata in manifest.get("files", {}).items():
              path = data_dir / filename
              if not path.is_file():
                  raise SystemExit(f"Manifest file missing after copy: {filename}")

              payload = path.read_bytes()
              if len(payload) != metadata.get("bytes"):
                  raise SystemExit(f"Size mismatch for {filename}")

              digest = hashlib.sha256(payload).hexdigest()
              if digest != metadata.get("sha256"):
                  raise SystemExit(f"SHA-256 mismatch for {filename}")

          print(f"Validated Sentinel publication {manifest['publication_id']}")
          PY


          echo "Website dashboard data:"


          ls -lh data/



          echo "Sentinel Dashboard Sample:"


          head -40 data/dashboard.json



          echo "Sentinel Brief Sample:"


          head -40 data/intelligence_brief.json




      - name: Commit dashboard updates

        run: |


          git config user.name "github-actions"

          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"



          git add data/



          if git diff --cached --quiet; then

              echo "No updates"

              exit 0

          fi



          git commit -m "Update intelligence feeds"



          git push
