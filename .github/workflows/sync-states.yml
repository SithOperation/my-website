name: Sync Monitor States

on:

  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"


permissions:
  contents: write


jobs:

  sync:

    runs-on: ubuntu-latest


    steps:


      - name: Checkout Website
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main


      - name: Checkout EWS
        uses: actions/checkout@v4
        with:
          repository: SithOperation/EWS-discord-monitor
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: external/ews
          ref: main


      - name: Checkout Disaster Monitor
        uses: actions/checkout@v4
        with:
          repository: SithOperation/earthquake-volcano-discord-monitor
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: external/disaster
          ref: main


      - name: Checkout AI Digest
        uses: actions/checkout@v4
        with:
          repository: SithOperation/ai-cyber-daily-digest
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: external/ai
          ref: main



      - name: Verify Files
        run: |

          test -f external/ews/state.json

          test -f external/disaster/disaster_state.json

          test -f external/ai/data/ai_cyber_digest.json



      - name: Copy JSON Data
        run: |

          mkdir -p data

          cp external/ews/state.json \
          data/ews_state.json

          cp external/disaster/disaster_state.json \
          data/disaster_state.json

          cp external/ai/data/ai_cyber_digest.json \
          data/ai_cyber_digest.json



      - name: Commit Updates
        run: |

          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


          git add data/


          if git diff --cached --quiet; then
              echo "No updates."
              exit 0
          fi


          git commit -m "Update intelligence feeds"

          git pull --rebase origin main

          git push origin main
