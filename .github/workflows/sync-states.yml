name: Sync Monitor States

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. Separate candidates let the guard identify the
    # intended slot even when GitHub starts a scheduled job late.
    - cron: "10 1 * * *"
    - cron: "10 2 * * *"
    - cron: "10 13 * * *"
    - cron: "10 14 * * *"
    - cron: "10 19 * * *"
    - cron: "10 20 * * *"

permissions:
  contents: write

concurrency:
  group: website-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check Eastern sync hour
        id: schedule
        shell: bash
        run: |
          event_name="${{ github.event_name }}"
          schedule_expression="${{ github.event.schedule }}"
          eastern_offset="$(TZ=America/New_York date +%z)"
          scheduled_hour="$(awk '{print $2}' <<< "$schedule_expression")"

          if [[ "$event_name" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running website sync at $(TZ=America/New_York date '+%Y-%m-%d %H:%M:%S %Z')"
          elif [[ "$eastern_offset" == "-0400" && ",1,13,19," == *",$scheduled_hour,"* ]] ||
               [[ "$eastern_offset" == "-0500" && ",2,14,20," == *",$scheduled_hour,"* ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Running delayed-safe Eastern schedule $schedule_expression"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping inactive DST candidate $schedule_expression for offset $eastern_offset"
          fi

      - name: Checkout website
        if: steps.schedule.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout disaster monitor
        if: steps.schedule.outputs.run == 'true'
        id: disaster
        uses: actions/checkout@v6
        with:
          repository: SithOperation/earthquake-volcano-discord-monitor
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: external/disaster

      - name: Checkout Sentinel Grid
        if: steps.schedule.outputs.run == 'true'
        id: sentinel
        uses: actions/checkout@v6
        with:
          repository: SithOperation/sentinel-grid-intelligence
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: external/sentinel

      - name: Validate and publish available monitor data
        if: steps.schedule.outputs.run == 'true'
        run: python3 scripts/sync-monitor-data.py

      - name: Commit changed website data
        if: steps.schedule.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/disaster_state.json \
            data/earthquakes.json \
            data/volcanoes.json \
            data/weather.json \
            data/solar.json \
            data/dashboard.json \
            data/intelligence_brief.json \
            data/map_events.json \
            data/timeline.json \
            data/trends.json \
            data/world_events.json \
            data/health.json \
            data/manifest.json

          if git diff --cached --quiet; then
            echo "No validated monitor updates"
            exit 0
          fi

          git commit -m "Update intelligence feeds"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
