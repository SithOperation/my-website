name: Sync Early Warning System

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ews-state-updated]
  schedule:
    # The source does not currently emit repository_dispatch events, so retain
    # a frequent fallback that is independent of Eastern-time scheduling.
    - cron: "*/10 * * * *"

permissions:
  contents: write

concurrency:
  group: website-data-sync
  cancel-in-progress: false

jobs:
  sync-ews:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout EWS
        uses: actions/checkout@v6
        with:
          repository: SithOperation/EWS-discord-monitor
          token: ${{ secrets.REPO_ACCESS_TOKEN }}
          path: external/ews

      - name: Validate and publish EWS state
        run: python3 scripts/sync-monitor-data.py --ews-only

      - name: Commit EWS update
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ews_state.json

          if git diff --cached --quiet; then
            echo "EWS state is already current"
            exit 0
          fi

          git commit -m "Update early warning state"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
