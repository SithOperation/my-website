name: Sync AI & Cyber Daily Digest

on:
  workflow_dispatch:
  schedule:
    # GitHub may delay scheduled jobs, so this workflow intentionally does not
    # gate execution on the runner's exact local hour.
    - cron: "10 14 * * *"

permissions:
  contents: write

concurrency:
  group: website-data-updates
  cancel-in-progress: false

jobs:
  sync-ai-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout completed AI digest
        uses: actions/checkout@v6
        with:
          repository: SithOperation/ai-cyber-daily-digest
          path: external/ai

      - name: Validate and publish AI digest
        run: python3 scripts/sync-monitor-data.py --ai-only

      - name: Commit AI digest update
        shell: bash
        run: |
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ai_cyber_digest.json

          if git diff --cached --quiet; then
            echo "AI digest is already current"
            exit 0
          fi

          git commit -m "Update AI Cyber Daily Digest"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
